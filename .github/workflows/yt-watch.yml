name: yt-watch

# 让 Agent “看” YouTube 视频。
# 本机（阿里 DSW 容器）对 youtube.com / googlevideo.com 双重封锁（DNS 投毒 + IP 段阻断），
# 无法直接访问。借 GitHub runner 的完整外网下载视频、抽帧、转写，结果 commit 回仓库，
# 本机再经 codeload.github.com 拉回。
#
# ⚠️ 坑一（已实测）：GitHub runner 的 Azure IP 段被 YouTube 整体标记，
#    任何 player_client（10 种）与 PO token（bgutil 2.0.2）都过不了
#    "Sign in to confirm you're not a bot"。必须先套 Cloudflare WARP 换出口 IP。
#
# ⚠️ 坑二（已实测）：WARP 只该用于访问 YouTube。当年把 whisper 的 HuggingFace
#    模型下载也放在 WARP 里，会报 "CAS Client Error: ... error decoding response body"。
#    因此顺序是：WARP 起→下视频/音频→WARP 撤→再转写。
#
# ⚠️ 坑三：可选步骤必须 continue-on-error，但**光看步骤 [OK] 会被骗**——
#    continue-on-error 会把失败标成成功。必须靠最后的「产物核验」判定。
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube URL 或 11 位视频 ID'
        required: true
        type: string
      frames:
        description: '抽取几张关键帧'
        required: false
        default: '12'
      start:
        description: '从第几秒开始（0=开头）'
        required: false
        default: '0'
      duration:
        description: '取多少秒（0=整片）'
        required: false
        default: '0'
      quality:
        description: '最大分辨率（如 360 / 720）'
        required: false
        default: '360'
      transcribe:
        description: '同时跑 whisper 转写（无字幕视频用，较慢）'
        required: false
        type: choice
        options: ['false', 'true']
        default: 'false'

jobs:
  grab:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg wireguard-tools
          python3 -m pip install -q --upgrade yt-dlp
          echo "yt-dlp = $(yt-dlp --version)"

      - name: 解析 URL
        id: u
        env:
          RAW: ${{ inputs.url }}
        run: |
          U="$RAW"
          if [ ${#U} -eq 11 ] && [[ "$U" =~ ^[A-Za-z0-9_-]+$ ]]; then
            U="https://www.youtube.com/watch?v=$U"
          fi
          echo "url=$U" >> "$GITHUB_OUTPUT"
          echo "解析为: $U"

      - name: 套 Cloudflare WARP（换出口 IP，绕 YouTube 的 IP 信誉封锁）
        run: |
          set -e
          TAG=$(curl -s -m 25 https://api.github.com/repos/ViRb3/wgcf/releases/latest \
                | python3 -c "import sys,json;print(json.load(sys.stdin)['tag_name'])")
          VER=${TAG#v}
          echo "wgcf $TAG"
          curl -fsSL -o /tmp/wgcf \
            "https://github.com/ViRb3/wgcf/releases/download/${TAG}/wgcf_${VER}_linux_amd64"
          chmod +x /tmp/wgcf
          cd /tmp && /tmp/wgcf register --accept-tos && /tmp/wgcf generate
          sudo wg-quick up /tmp/wgcf-profile.conf
          sleep 5
          echo "出口 IP: $(curl -s -m 20 https://api.ipify.org || echo 取不到)"

      - name: 下载视频（经 WARP）
        env:
          URL: ${{ steps.u.outputs.url }}
          Q: ${{ inputs.quality }}
        run: |
          mkdir -p out/frames
          # WARP 同时给 IPv4/IPv6，googlevideo 走 IPv6 常握手超时（_ssl.c:983），
          # 所以强制 IPv4；并加大重试与超时。
          # 优先选「音视频合一」的渐进式流（如 18），它比分离流(bv*+ba)可靠得多 ——
          # 分离的视频流常报 "Did not get any data blocks"。
          yt-dlp --no-warnings \
            --force-ipv4 --retries 20 --fragment-retries 20 --socket-timeout 30 \
            -f "b[height<=${Q}][ext=mp4]/b[height<=${Q}]/bv*[height<=${Q}]+ba/b" \
            --merge-output-format mp4 -o "out/video.%(ext)s" "$URL"
          yt-dlp --no-warnings --force-ipv4 --skip-download --dump-single-json "$URL" > out/meta.json || true
          ls -la out/ out/frames/

      - name: 抽帧
        env:
          FRAMES: ${{ inputs.frames }}
          START: ${{ inputs.start }}
          DUR: ${{ inputs.duration }}
        run: |
          SRC=$(ls out/video.* | head -1)
          TOTAL=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$SRC" | cut -d. -f1)
          if [ "$DUR" = "0" ]; then EFF=$((TOTAL - START)); else EFF=$DUR; fi
          [ "$EFF" -lt 1 ] && EFF=1
          FPS=$(python3 -c "print(max(0.02, $FRAMES/$EFF))")
          echo "总长=${TOTAL}s 起点=${START}s 取${EFF}s 抽 ${FRAMES} 帧 fps=$FPS"
          ffmpeg -hide_banner -loglevel error -ss "$START" -t "$EFF" -i "$SRC" \
            -vf "fps=$FPS,scale=-2:480" -q:v 3 out/frames/f%03d.jpg
          echo "实际抽帧: $(ls out/frames | wc -l) 张"

      - name: 抓字幕（有就抓，没有则跳过）
        env:
          URL: ${{ steps.u.outputs.url }}
        run: |
          yt-dlp --no-warnings --skip-download --write-subs --write-auto-subs \
            --sub-langs "zh.*,en.*" --sub-format vtt -o "out/subs" "$URL" || true
          ls -la out/ | grep -i sub || echo "无字幕轨"

      - name: 下载音频（经 WARP，供转写用）
        if: ${{ inputs.transcribe == 'true' }}
        env:
          URL: ${{ steps.u.outputs.url }}
        run: |
          yt-dlp --no-warnings -f "ba/b" -o "out/audio.%(ext)s" "$URL"
          ls -la out/audio.*

      - name: 撤掉 WARP（转写与提交都走正常网络）
        if: always()
        run: sudo wg-quick down /tmp/wgcf-profile.conf || true

      - name: whisper 转写（独立 venv，隔离 runner 预装的旧版 av）
        if: ${{ inputs.transcribe == 'true' }}
        continue-on-error: true
        run: |
          # runner 镜像预装了旧版 PyAV，且 ~/.local 与系统 dist-packages 互相遮蔽，
          # pip install -U av 顶不掉它。用全新 venv 从根上隔离。
          python3 -m venv /tmp/wv
          # 关键：`metadata_errors` 是在 **PyAV 19 中被移除**的，而 faster-whisper 仍会传这个参数。
          # 所以必须把 av 钉在 <19 —— 之前一路"升级 av"的方向是反的，越升越坏。
          /tmp/wv/bin/pip install -q -U faster-whisper "av<19"
          echo "--- 版本（留证据）---"
          /tmp/wv/bin/python -c "import av, faster_whisper; print('av =', av.__version__); print('faster-whisper =', faster_whisper.__version__)"
          cat > /tmp/tr.py <<'PY'
          import sys
          from faster_whisper import WhisperModel
          m = WhisperModel("small", device="cpu", compute_type="int8")
          segs, info = m.transcribe(sys.argv[1], vad_filter=True)
          lines = ["[%7.1f] %s" % (s.start, s.text.strip()) for s in segs]
          open("out/transcript.txt", "w").write("\n".join(lines))
          print("transcript segments:", len(lines))
          PY
          AUDIO=$(ls out/audio.* | head -1)
          for i in 1 2 3; do
            echo "--- 转写尝试 $i ---"
            if /tmp/wv/bin/python /tmp/tr.py "$AUDIO"; then echo "✅ 转写完成"; exit 0; fi
            echo "失败，15 秒后重试"; sleep 15
          done
          echo "⚠️ 三次转写均失败，放行（不阻塞抽帧交付）"

      - name: 产物核验（**唯一可信的成败判据**，不采信步骤自报）
        if: always()
        run: |
          echo "════ 产物核验 ════"
          NF=$(ls out/frames 2>/dev/null | wc -l)
          echo "帧数         : $NF"
          [ -f out/meta.json ] && echo "meta.json    : ✅ $(stat -c%s out/meta.json) 字节" || echo "meta.json    : ❌ 缺失"
          if [ "${{ inputs.transcribe }}" = "true" ]; then
            if [ -f out/transcript.txt ]; then
              echo "transcript   : ✅ $(wc -l < out/transcript.txt) 行"
            else
              echo "transcript   : ❌ 缺失（转写没成功 —— 别被 whisper 步骤的 [OK] 骗了）"
            fi
          fi
          if [ "$NF" -lt 1 ]; then
            echo "::error::核心产物缺失：一张帧都没抽到"
            exit 1
          fi
          echo "✅ 核心产物（帧）齐备"

      - name: 打包元信息
        if: always()
        env:
          URL: ${{ steps.u.outputs.url }}
        run: |
          {
            echo "# yt-watch 结果"
            echo
            echo "- URL: $URL"
            echo "- 抽帧: $(ls out/frames 2>/dev/null | wc -l) 张"
            echo "- 转写: $([ -f out/transcript.txt ] && echo "有 ($(wc -l < out/transcript.txt) 行)" || echo 无)"
            echo "- 时间: $(date -u +%FT%TZ)"
            echo
            echo "## 文件"
            find out -type f | sed 's/^/- /'
          } > out/SUMMARY.md
          cat out/SUMMARY.md

      - name: 提交回仓库（本机经 codeload 拉取）
        if: always()
        run: |
          git config user.name  "yt-watch-bot"
          git config user.email "yt-watch-bot@users.noreply.github.com"
          rm -rf latest
          mkdir -p latest
          cp -r out/* latest/ 2>/dev/null || true
          # 视频/音频是中间产物，不进仓库（否则每跑一次仓库涨几百 KB）
          rm -f latest/video.* latest/audio.*
          rm -rf out
          git add -A
          git commit -m "yt-watch: $(date -u +%FT%TZ) [skip ci]" || echo "无变更"
          git push
